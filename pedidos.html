<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos · Flamora</title>
<link rel="icon" type="image/png" href="logo-flamora.png">
<style>
  :root{
    --bg:#F4F2ED; --ink:#2F3A47; --muted:#7B8591; --line:#E3E0D8;
    --coral:#E8604C; --coral-dark:#C84A38; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;line-height:1.45}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--coral);outline-offset:2px}

  /* ---------- Encabezado ---------- */
  .top-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 28px}
  .buscar{position:relative;max-width:320px}
  .buscar input{width:100%;padding:11px 40px 11px 12px;border:1px solid #B9BEC5;background:transparent;border-radius:0}
  .buscar svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6}
  .logo{justify-self:center;text-decoration:none;color:var(--coral);font-size:1.5rem;letter-spacing:.3em}
  .logo img{display:block;height:76px;width:auto}
  .carrito-btn{justify-self:end;position:relative;border:0;background:none;padding:6px}
  .carrito-btn svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:1.6}
  .badge{position:absolute;top:-2px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
         background:var(--coral);color:#fff;font-size:.7rem;display:grid;place-items:center}
  nav{display:flex;justify-content:center;gap:34px;padding:14px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  nav a,nav button{border:0;background:none;text-decoration:none;color:var(--ink);padding:0}
  nav a:hover,nav button:hover{color:var(--coral-dark)}

  /* ---------- Contenido ---------- */
  main{max-width:1320px;margin:0 auto;padding:28px 28px 70px}
  h1{font-size:2.6rem;font-weight:600;margin:6px 0 22px}
  .barra{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .barra select{border:0;background:none;padding:6px 4px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 22px}
  .card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line)}
  .card .info{padding:12px 10px 0}
  .card .nombre{margin:0 0 6px;color:#4A5561;font-size:.95rem}
  .card .precio{margin:0}
  .card .precio b{font-size:1rem}
  .card .off{color:#E0922B;font-size:.72rem;margin-left:4px}
  .card .antes{margin:2px 0 0;color:var(--muted);font-size:.78rem;text-decoration:line-through}
  .comprar{margin-top:12px;padding:9px 22px;border:0;background:var(--coral);color:#fff;font-size:.85rem}
  .comprar:hover{background:var(--coral-dark)}
  .vacio{color:var(--muted)}

  /* ---------- Ventana de opciones ---------- */
  dialog{border:0;padding:0;width:min(440px,94vw);max-height:92vh;overflow:auto;background:var(--card)}
  dialog::backdrop{background:rgba(30,35,42,.55)}
  .m-img{display:block;width:100%;height:240px;object-fit:cover;background:var(--line)}
  .m-cuerpo{padding:16px 20px 20px}
  .m-cuerpo h3{margin:0;font-size:1.3rem}
  .detalle{color:var(--muted);font-size:.9rem}
  .m-precio{margin:6px 0 12px}
  .m-precio b{font-size:1.15rem}
  .cerrar{position:absolute;top:8px;right:10px;width:34px;height:34px;border:0;border-radius:50%;
          background:rgba(255,255,255,.92);font-size:1.4rem;line-height:1}
  .opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opciones .ancho{grid-column:1/-1}
  label{display:block;margin:12px 0 4px;font-size:.88rem}
  .opciones label{margin:0 0 3px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid #CFCBC1;background:#fff;border-radius:0}
  .fila{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
  .qty{display:flex;align-items:center;gap:10px}
  .qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--coral);background:#fff;color:var(--coral);font-size:1.2rem}
  .qty button:hover{background:var(--coral);color:#fff}
  .qty span{min-width:22px;text-align:center}
  .agregar{padding:11px 18px;border:0;background:var(--coral);color:#fff}
  .agregar:hover{background:var(--coral-dark)}

  /* ---------- Carrito lateral ---------- */
  .overlay{position:fixed;inset:0;background:rgba(30,35,42,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .overlay.abierto{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--bg);z-index:30;overflow-y:auto;
          padding:20px 22px 28px;transform:translateX(100%);transition:transform .25s}
  .drawer.abierto{transform:none}
  .drawer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .drawer h2{margin:0;font-size:1.4rem}
  .drawer .x{border:0;background:none;font-size:1.8rem;line-height:1}
  .drawer h4{margin:24px 0 4px;font-size:1rem}
  .linea{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .linea small{display:block;color:var(--muted)}
  .linea .quitar{border:0;background:none;color:var(--coral-dark);text-decoration:underline;padding:0}
  .info-pago{margin-top:8px;padding:10px 12px;border:1px dashed var(--coral);background:#fff;font-size:.9rem}
  .total{display:flex;justify-content:space-between;font-size:1.2rem;margin:20px 0 14px;padding-top:14px;border-top:2px solid var(--line)}
  .send{width:100%;padding:14px;border:0;background:var(--coral);color:#fff;font-size:1.02rem}
  .send:hover{background:var(--coral-dark)}
  .send:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:12px;color:var(--coral-dark);min-height:1.4em}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 20px;
         opacity:0;pointer-events:none;transition:all .25s;z-index:40}
  .toast.ver{opacity:1;transform:translate(-50%,0)}

  @media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:720px){
    .top-row{padding:14px 14px;grid-template-columns:1fr auto auto}
    .logo{grid-column:2}
    .carrito-btn{grid-column:3;margin-left:6px}
    .logo img{height:54px}
    main{padding:20px 14px 60px}
    h1{font-size:1.9rem}
    .grid{grid-template-columns:repeat(2,1fr);gap:20px 12px}
    nav{gap:20px;font-size:.92rem}
  }
  @media (max-width:420px){.opciones{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="buscar">
      <input id="buscar" type="search" placeholder="Buscar" aria-label="Buscar velas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </div>
    <a class="logo" href="#" aria-label="Flamora, velas artesanales"><img src="logo-flamora.png" alt="Flamora · Velas artesanales" onerror="this.replaceWith('FLAMORA')"></a>
    <button class="carrito-btn" id="abrirCarrito" aria-label="Ver mi pedido">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
      <span class="badge" id="badge">0</span>
    </button>
  </div>
  <nav>
    <a href="#catalogo">Catálogo</a>
    <button type="button" id="navPedido">Mi pedido</button>
    <a href="#" id="navContacto" target="_blank" rel="noopener">Contacto</a>
  </nav>
</header>

<main id="catalogo">
  <h1>Nuestras velas</h1>
  <div class="barra">
    <label for="orden" style="margin:0">Ordenar:</label>
    <select id="orden" style="width:auto">
      <option value="">Predeterminado</option>
      <option value="menor">Precio: menor a mayor</option>
      <option value="mayor">Precio: mayor a menor</option>
      <option value="az">Nombre A–Z</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- Ventana de opciones de cada vela -->
<dialog id="modal"></dialog>

<!-- Carrito lateral -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Mi pedido">
  <div class="drawer-top">
    <h2>Mi pedido</h2>
    <button class="x" id="cerrarCarrito" aria-label="Cerrar">×</button>
  </div>
  <div id="carrito"></div>

  <h4>Tus datos</h4>
  <label for="nombre">Nombre</label>
  <input id="nombre" autocomplete="name">
  <label for="telefono">WhatsApp (con lada)</label>
  <input id="telefono" type="tel" autocomplete="tel" placeholder="998 123 4567">
  <label for="entrega">Entrega</label>
  <select id="entrega">
    <option>Recoger</option>
    <option>Envío a domicilio</option>
  </select>
  <label for="direccion">Dirección (si es envío)</label>
  <input id="direccion" autocomplete="street-address">
  <label for="fecha">¿Para cuándo la necesitas?</label>
  <input id="fecha" type="date">
  <label for="dedicatoria">Dedicatoria o comentarios</label>
  <textarea id="dedicatoria" rows="3"></textarea>

  <label for="pago">Forma de pago</label>
  <select id="pago"></select>
  <div class="info-pago" id="infoPago"></div>

  <div class="total"><span>Total</span><strong id="total">$0.00</strong></div>
  <button class="send" id="enviar">Enviar pedido por WhatsApp</button>
  <div class="msg" id="msg" role="status"></div>
</aside>

<div class="toast" id="toast" role="status">Agregado a tu pedido</div>

<script>
/* ====== CONFIGURA ESTO ====== */
const WHATSAPP = "5219982160371";                         // 52 + 1 + lada + número, sin signos
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxbQ140PVNboFoMQ6xinvmjZO1aVbhTtsFeX5V6MiSRsGJaX5puPJqNrMzXXszFK3oO/exec"; // termina en /exec

// Formas de pago y el texto que se muestra al elegirlas.
// Mejor no pongas aquí tu CLABE ni número de cuenta: la página es pública. Envíala por WhatsApp al confirmar.
const PAGOS = {
  "Transferencia": "Te enviamos los datos por WhatsApp al confirmar tu pedido.",
  "Efectivo": "Pagas en efectivo al recoger o al recibir tu pedido.",
  "Depósito": "Te enviamos los datos por WhatsApp al confirmar tu pedido."
};

// Un bloque por vela. "foto" es la ruta de la imagen dentro de tu repositorio.
// En "empaques", "extra" es lo que se suma al precio (0 si no cuesta más).
const CATALOGO = [
  {
    id: "v1",
    nombre: "Reno navideño pequeño",
    foto: "Reno navideño pequeño.jpg",
    detalle: "Cera de soya · Altura 6 cm",
    precio: 60,
    colores: ["Violeta", "Rosado", "Taro purple", "Fluorencense purple", "Naranja", "Rojo", "Amarillo", "Azul", "Cirulean Azul", "Café", "Verde pasto", "Matcha", "Amarillo macarron", "Verde olivo"],
    aromas: ["Pino", "Nochebuena", "Manzana canela", "Canela","Vainilla", "Romero", "Café", "Coco", "Rosas", "Pastel", "Floral", "Lavanda"],
    empaques: [
      { nombre: "Caja de carton grande", extra: 0 },
      { nombre: "Caja de regalo", extra: 40 }
    ]
  },
  {
    id: "v1",
    nombre: "Reno navideño pequeño",
    foto: "Reno navideño pequeño.jpg",
    detalle: "Cera de soya · Altura 6 cm",
    precio: 60,
    colores: ["Violeta", "Rosado", "Taro purple", "Fluorencense purple", "Naranja", "Rojo", "Amarillo", "Azul", "Cirulean Azul", "Café", "Verde pasto", "Matcha", "Amarillo macarron", "Verde olivo"],
    aromas: ["Pino", "Nochebuena", "Manzana canela", "Canela","Vainilla", "Romero", "Café", "Coco", "Rosas", "Pastel", "Floral", "Lavanda"],
    empaques: [
      { nombre: "Caja de carton grande", extra: 0 },
      { nombre: "Caja de regalo", extra: 40 }
    ]
  },
];
/* ============================ */

const $ = id => document.getElementById(id);
const r2 = n => Math.round(n * 100) / 100;
const money = n => "$" + Number(n).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const precioFinal = p => r2(p.precio * (1 - (p.descuento || 0) / 100));
const opciones = l => l.map(o => `<option>${o}</option>`).join("");

let carrito = [];
let actual = null;   // vela abierta en la ventana
let qtyActual = 1;

/* ---------- Catálogo ---------- */
function listaVisible(){
  const q = $("buscar").value.trim().toLowerCase();
  const arr = CATALOGO.filter(p => p.nombre.toLowerCase().includes(q));
  const o = $("orden").value;
  if(o === "menor") arr.sort((a,b) => precioFinal(a) - precioFinal(b));
  if(o === "mayor") arr.sort((a,b) => precioFinal(b) - precioFinal(a));
  if(o === "az") arr.sort((a,b) => a.nombre.localeCompare(b.nombre, "es"));
  return arr;
}

function pintarCatalogo(){
  const arr = listaVisible();
  $("grid").innerHTML = arr.length ? arr.map(p => {
    const desc = p.descuento > 0;
    return `
    <article class="card">
      <img src="${p.foto}" alt="${p.nombre}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="info">
        <p class="nombre">${p.nombre}</p>
        <p class="precio"><b>${money(precioFinal(p))}</b>${desc ? `<span class="off">-${p.descuento}% OFF</span>` : ""}</p>
        ${desc ? `<p class="antes">${money(p.precio)}</p>` : ""}
        <button class="comprar" data-id="${p.id}">Comprar</button>
      </div>
    </article>`;
  }).join("") : '<p class="vacio">No encontramos velas con ese nombre.</p>';
}

$("buscar").addEventListener("input", pintarCatalogo);
$("orden").addEventListener("change", pintarCatalogo);

/* ---------- Ventana de opciones ---------- */
function abrirModal(id){
  actual = CATALOGO.find(x => x.id === id); qtyActual = 1;
  const p = actual, desc = p.descuento > 0;
  $("modal").innerHTML = `
    <button class="cerrar" data-cerrar aria-label="Cerrar">×</button>
    <img class="m-img" src="${p.foto}" alt="${p.nombre}" onerror="this.style.display='none'">
    <div class="m-cuerpo">
      <h3>${p.nombre}</h3>
      <div class="detalle">${p.detalle}</div>
      <div class="m-precio"><b>${money(precioFinal(p))}</b>${desc ? ` <span class="antes" style="text-decoration:line-through;color:var(--muted);font-size:.85rem">${money(p.precio)}</span>` : ""}</div>
      <div class="opciones">
        <div><label for="m-c">Color</label><select id="m-c">${opciones(p.colores)}</select></div>
        <div><label for="m-a">Aroma</label><select id="m-a">${opciones(p.aromas)}</select></div>
        <div class="ancho"><label for="m-e">Empaque</label>
          <select id="m-e">${p.empaques.map((e,i) =>
            `<option value="${i}">${e.nombre}${e.extra ? " (+" + money(e.extra) + ")" : ""}</option>`).join("")}</select></div>
      </div>
      <div class="fila">
        <div class="qty">
          <button type="button" data-d="-1" aria-label="Quitar uno">−</button>
          <span id="m-q">1</span>
          <button type="button" data-d="1" aria-label="Agregar uno">+</button>
        </div>
        <button type="button" class="agregar" data-agregar>Agregar al pedido</button>
      </div>
    </div>`;
  $("modal").showModal();
}

$("grid").addEventListener("click", e => {
  const b = e.target.closest(".comprar"); if(b) abrirModal(b.dataset.id);
});

$("modal").addEventListener("click", e => {
  if(e.target === $("modal")) return $("modal").close();       // clic fuera
  const b = e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-cerrar")) return $("modal").close();
  if(b.dataset.d){
    qtyActual = Math.max(1, qtyActual + Number(b.dataset.d));
    $("m-q").textContent = qtyActual;
  }
  if(b.hasAttribute("data-agregar")){
    const emp = actual.empaques[Number($("m-e").value)];
    const unit = precioFinal(actual) + emp.extra;
    carrito.push({
      producto: actual.nombre, color: $("m-c").value, aroma: $("m-a").value,
      empaque: emp.nombre, cantidad: qtyActual, subtotal: r2(unit * qtyActual)
    });
    $("modal").close();
    pintarCarrito();
    const t = $("toast"); t.classList.add("ver"); setTimeout(() => t.classList.remove("ver"), 1800);
  }
});

/* ---------- Carrito ---------- */
function totalPedido(){ return r2(carrito.reduce((s,l) => s + l.subtotal, 0)); }

function pintarCarrito(){
  $("carrito").innerHTML = carrito.length ? carrito.map((l,i) => `
    <div class="linea">
      <div><b>${l.cantidad} x ${l.producto}</b><small>${l.color} · ${l.aroma} · ${l.empaque}</small></div>
      <div style="text-align:right">${money(l.subtotal)}<br><button type="button" class="quitar" data-quitar="${i}">Quitar</button></div>
    </div>`).join("") : '<p class="vacio">Aún no has agregado velas.</p>';
  $("total").textContent = money(totalPedido());
  $("badge").textContent = carrito.reduce((s,l) => s + l.cantidad, 0);
}

$("carrito").addEventListener("click", e => {
  const b = e.target.closest("[data-quitar]"); if(!b) return;
  carrito.splice(Number(b.dataset.quitar), 1); pintarCarrito();
});

const abrirDrawer = () => { $("drawer").classList.add("abierto"); $("overlay").classList.add("abierto"); };
const cerrarDrawer = () => { $("drawer").classList.remove("abierto"); $("overlay").classList.remove("abierto"); };
$("abrirCarrito").addEventListener("click", abrirDrawer);
$("navPedido").addEventListener("click", abrirDrawer);
$("cerrarCarrito").addEventListener("click", cerrarDrawer);
$("overlay").addEventListener("click", cerrarDrawer);
document.addEventListener("keydown", e => { if(e.key === "Escape") cerrarDrawer(); });
$("navContacto").href = "https://wa.me/" + WHATSAPP;

/* ---------- Forma de pago ---------- */
$("pago").innerHTML = Object.keys(PAGOS).map(k => `<option>${k}</option>`).join("");
const mostrarPago = () => $("infoPago").textContent = PAGOS[$("pago").value];
$("pago").addEventListener("change", mostrarPago);

/* ---------- Enviar pedido ---------- */
$("enviar").addEventListener("click", async () => {
  const nombre = $("nombre").value.trim(), tel = $("telefono").value.trim();
  if(!carrito.length) return $("msg").textContent = "Agrega al menos una vela a tu pedido.";
  if(!nombre || !tel) return $("msg").textContent = "Escribe tu nombre y tu WhatsApp.";

  const total = totalPedido();
  const pedido = {
    nombre, telefono: tel, entrega: $("entrega").value, direccion: $("direccion").value.trim(),
    fechaEntrega: $("fecha").value, dedicatoria: $("dedicatoria").value.trim(), pago: $("pago").value,
    detalle: carrito.map(l => `${l.cantidad} x ${l.producto} (${l.color}, ${l.aroma}, ${l.empaque})`).join("; "),
    total
  };

  $("enviar").disabled = true; $("msg").textContent = "Guardando tu pedido…";

  // 1) Guardar en Google Sheets (si falla, igual abrimos WhatsApp)
  try{
    await Promise.race([
      fetch(URL_SCRIPT, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(pedido) }),
      new Promise((_,rej) => setTimeout(rej, 6000))
    ]);
  }catch(err){ console.warn("No se pudo guardar en Sheets", err); }

  // 2) Abrir WhatsApp con el resumen
  const texto =
`Hola, quiero hacer un pedido en Flamora:
${carrito.map(l => `• ${l.cantidad} x ${l.producto} – ${l.color}, ${l.aroma}, ${l.empaque} (${money(l.subtotal)})`).join("\n")}
Total: ${money(total)}
Pago: ${pedido.pago}
Nombre: ${nombre}
Entrega: ${pedido.entrega}${pedido.direccion ? " – " + pedido.direccion : ""}
${pedido.fechaEntrega ? "Para el: " + pedido.fechaEntrega + "\n" : ""}${pedido.dedicatoria ? "Dedicatoria: " + pedido.dedicatoria : ""}`;
  window.location.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(texto);
});

pintarCatalogo();
pintarCarrito();
mostrarPago();
</script>
</body>
</html>
